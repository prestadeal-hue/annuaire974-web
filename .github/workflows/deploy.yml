name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installation
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Upload de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Déploiement Pages
        uses: actions/deploy-pages@v4
