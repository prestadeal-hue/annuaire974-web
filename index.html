<!doctype html>
<html lang="fr" data-theme="sombre">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D2E" />
    <script>
      // Thème unique : l'annuaire suit la charte sombre de tisite.re.
      document.documentElement.setAttribute('data-theme', 'sombre');
    </script>
    <meta
      name="description"
      content="Annuaire 974 — l'assistant des commerces et prestataires de La Réunion. Posez votre question, il répond."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Annuaire974" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- PAS de <link rel="manifest"> ici : le plugin PWA l'injecte avec la base
         du projet (/annuaire974/). Un lien écrit à la main en dur pointait sur
         /manifest.webmanifest, c'est-à-dire le manifeste du site tisite.re lui-
         même — un visiteur qui « installe » l'appareil ouvrait alors tisite.re. -->
    <title>Annuaire 974 — L'assistant des commerces de La Réunion</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Activez JavaScript pour utiliser Annuaire 974.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
